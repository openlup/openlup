id: portable-no-industry-contracts
valid:
  - 'const watchdog = clock; const dogfoodEvidence = receipt;'
  - 'type WatchdogStatus = "running" | "stopped"; type CatalogCategory = { category: string };'
  - 'const DOGFOOD_EVIDENCE = receipt; const WATCHDOG_INTERVAL = 10;'
  - 'const category = "petId"; const hint = "dogWeightKg"; const labels = ["catProfile"];'
  - 'const message = { "hint": "petId", label: "dogWeightKg" };'
  - 'const hint = `catProfile`;'
  - 'type ExtensionData = Record<string, unknown>; function forward(extensionData: ExtensionData) { return { extensionData }; }'
  - 'function forward<T>(extensionData: T): T { return extensionData; }'
  - 'const envelope = { [adopterKey]: adopterValue };'
  - 'const envelope = { [`pet${suffix}`]: adopterValue };'
  - 'const { extensionData } = input; return extensionData;'
  - 'type Input = Record<"orderId", string>; type Mode = "catalog" | "catch";'
  - 'const category = concatenate(parts); catchError(error);'
  - '// petId, dogWeightKg and catProfile are opaque adopter examples.'
invalid:
  - 'const petId = input.id;'
  - 'interface Input { dogWeightKg: number; catProfile: unknown; }'
  - 'type CatProfile = { id: string };'
  - 'interface Input { pets: readonly string[]; }'
  - 'function reserve(dogsCount: number) {}'
  - 'const entity = { petId };'
  - 'const entity = { dogWeightKg: weight };'
  - 'const entity = { "catProfile": profile };'
  - 'interface Input { "dogWeightKg"?: number; }'
  - 'class Input { "catProfile": unknown; }'
  - 'type Input = Record<"petId", string>;'
  - 'type OwnerKey = "dogId";'
  - 'type Input = { [key in "petId"]?: string };'
  - 'const createPetProfile = input;'
  - 'const customerDogsAllowed = input;'
  - 'const order_pet_id = input;'
  - 'const DOG_WEIGHT_KG = input;'
  - 'const cats_count = input;'
  - 'const profile = input.petId;'
  - 'const profile = input["petId"];'
  - 'const entity = { ["catProfile"]: profile };'
  - 'const { "petId": entityId } = input;'

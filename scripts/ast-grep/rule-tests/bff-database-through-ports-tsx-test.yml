id: bff-database-through-ports-tsx
valid:
  - 'export const View = () => <span>{Array.from(rows).length}</span>;'
  - 'export const View = () => <span>{globalThis.Uint8Array["from"](bytes).length}</span>;'
  - 'logger.warn("@example/supabase-js");'
  - 'export const View = () => <span>{db[parse("from")]("orders")}</span>;'
  - 'export const View = () => <span>{(Array).from(rows).length}</span>;'
  - 'export const View = () => <span>{(Buffer as typeof Buffer)["from"](payload).length}</span>;'
  - 'export const View = () => <span>{Uint8Array!.from(payload).length}</span>;'
  - 'export const View = () => <span>{(globalThis.Array satisfies typeof Array).from(rows).length}</span>;'
  - 'export const View = () => <span>{( /* keep receiver */ Array).from(rows).length}</span>;'
  - 'export const View = () => <span>{( /* comment */ Buffer as typeof Buffer).from(payload).length}</span>;'
  - 'const { from: copy } = (Array as typeof Array); export const View = () => <span>{copy(rows).length}</span>;'
  - 'const { from = fallback } = Buffer;'
  - '({ "from": copy } = Uint8Array!);'
  - 'const { createClientHint: hint } = deps;'
  - 'const { clientFactory } = deps;'
  - 'const dependencies = { clientFactory, createClientHint };'
  - 'type createClient = (url: string) => unknown; interface Input { factory: createClient; }'
  - 'interface createClient { connect(): unknown; } type Wrapper<T extends createClient> = T;'
  - 'declare class createClient {}'
  - 'class ClientFactory {} const Factory = class Adapter {};'
  - 'const hint = "createClient"; type Hint = "createClient";'
  - 'const dependencies = { "createClient": factory, ["createClient"]: factory };'
invalid:
  - 'export const View = () => <span>{createClient(url, key)}</span>;'
  - 'export const View = () => <span>{db[("from")]("orders")}</span>;'
  - 'export const View = () => <span>{db["rpc" as keyof Db]("fn")}</span>;'
  - 'const sdkName = "@example/supabase-js"; export const View = () => <span>{sdkName}</span>;'
  - 'logger.warn(await import("@example/supabase-js"));'
  - 'const { from: select, rpc: invoke } = client; export const View = () => <span>{select.call(client, "orders")}</span>;'
  - 'const { from, rpc } = client;'
  - 'const { from = fallback, rpc: invoke = fallback } = client;'
  - 'const { "from": select, "rpc": invoke } = client;'
  - 'const { [`from`]: select, ["rpc"]: invoke } = client;'
  - '({ from: select, rpc } = client);'
  - 'const { from: sender } = neutralDto;'
  - 'const { rpc } = Array;'
  - 'const { from: select } = (client as typeof Array);'
  - '({ from: select } = (client satisfies typeof Buffer));'
  - 'export const View = () => <span>{(db as typeof Array).from("orders")}</span>;'
  - 'export const View = () => <span>{(db satisfies typeof Buffer)["from"]("orders")}</span>;'
  - 'const { createClient } = deps;'
  - 'const { createClient = fallback } = deps;'
  - '({ createClient } = deps);'
  - '({ createClient = fallback } = deps);'
  - 'export const { createClient } = deps;'
  - 'export const { createClient: connect } = deps;'
  # Ordinary factory references: identifier, property, pattern and object shorthand.
  - 'const dependencies = { createClient };'
  - 'const dependencies = { nested: { createClient } };'
  - 'consume({ createClient });'
  - 'function dependencies() { return { createClient }; }'
  - 'consume(createClient);'
  - 'function factory() { return createClient; }'
  - 'const dependencies = { connect: createClient };'
  - 'const dependencies = { ...createClient };'
  - 'consume(...createClient);'
  - 'function use({ createClient = fallback }) {}'
  - 'function use({ createClient: connect }) {}'
  - 'const factory = deps?.createClient;'
  - 'const factory = deps["createClient"];'
  # Runtime class names are type_identifier; erased aliases stay valid above.
  - 'class createClient {}'
  - 'export class createClient {}'
  - 'const Factory = class createClient {};'
  - 'abstract class createClient {}'

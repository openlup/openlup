id: bff-database-through-ports
language: TypeScript
severity: error
message: BFF code reaches the database only through a port or the actor data gateway.
note: |
  Architecture rule (AGENTS.md): provider SDKs and database clients stay behind
  adapter and infrastructure boundaries. A BFF module composes a use case; it
  does not construct a database client, import the client SDK, or call
  `.from()` / `.rpc()` itself. Inject the port, or use the actor data gateway
  (`createPlatformActorDataGateway`), and move the query into server/adapters.
files:
  - server/bff/**/*.ts
ignores:
  - "**/*.test.ts"
rule:
  any:
    - kind: import_statement
      has: { field: source, regex: "supabase-js" }
    - kind: export_statement
      has: { field: source, regex: "supabase-js" }
    - kind: call_expression
      all:
        - has: { field: function, regex: "^(import|require)$" }
        - has: { field: arguments, regex: "supabase-js" }
    - kind: call_expression
      has: { field: function, regex: "^createClient$" }
    - kind: call_expression
      has:
        field: function
        kind: member_expression
        all:
          - has: { field: property, regex: "^(from|rpc)$" }
          - not: { has: { field: object, regex: "^(Array|Buffer|Object|Promise|Uint8Array)$" } }

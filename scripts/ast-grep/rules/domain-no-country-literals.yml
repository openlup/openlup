id: domain-no-country-literals
language: TypeScript
severity: error
message: A two-letter code in domain code is a country or region, which is adopter policy; read it from the settlement profile or a port.
note: |
  Architecture rule (AGENTS.md): an adopter's local rules stay outside generic
  platform code. The rule refuses every two-letter uppercase string literal in
  domain code, in any position (value, comparison, switch case, array, enum,
  type), because in this codebase such a literal is a country or region code.
  Take the code from the settlement profile, configuration or the caller.
  Tests, fixtures and test helpers are exempt. The files under `ignores`
  predate this rule: delete an entry when its file is fixed and never add one.
  A genuine non-country code is an `ast-grep-ignore` comment naming this rule
  on the line before the code, with the reason in a comment above it.
files:
  - server/domains/**/*.ts
  - src/domains/**/*.ts
  - packages/core/src/**/*.ts
ignores:
  - "**/*.test.ts"
  - "**/*.fixtures.ts"
  - "**/*.testFixtures.ts"
  - "**/*TestKit.ts"
  - "**/*TestHelpers.ts"
  # Not debt: files whose two-letter codes are not countries (an example
  # placeholder and the carrier status table).
  - src/domains/communications/email/exampleEmailPresentation.ts
  - src/domains/fulfillment/status.ts
  # Debt: pre-existing country literals; delete an entry when its file is fixed.
  - server/domains/accounting/staticInvoiceDataLookupPort.ts
  - server/domains/commerce/orderRecapMapping.ts
  - server/domains/company-identity/companyIdentityService.ts
  - server/domains/shipping/dictionaryDeliverySelectionPort.ts
  - server/domains/shipping/staticDeliverySelectionPort.ts
  - src/domains/accounting/accountingControlContracts.ts
  - src/domains/address-canon/contracts.ts
  - src/domains/commerce/checkoutContracts.ts
  - src/domains/commerce/configuratorIntentContracts.ts
  - src/domains/commerce/orderRecapContracts.ts
  - src/domains/company-identity/companyIdentityContracts.ts
  - src/domains/customers/addressCanonical.ts
  - src/domains/customers/customerAddressSelfServiceContracts.ts
  - src/domains/shipping/deliverySelectionContracts.ts
  - src/domains/shipping/inpostGeowidgetPoint.ts
rule:
  any:
    - { kind: string, regex: "^[\"'][A-Z]{2}[\"']$" }
    - { kind: template_string, regex: "^`[A-Z]{2}`$" }

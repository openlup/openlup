id: domain-no-environment-reads
language: TypeScript
severity: error
message: Domain code does not read the environment; take the value through a port or a parameter.
note: |
  Architecture rule (AGENTS.md): environment readers stay behind
  infrastructure and adapter boundaries. Read the variable in server/infra or
  in the composition root and pass the value in. The rule refuses any `env`
  read, and any destructuring of `env` (declaration, parameter default,
  assignment or loop head), from an expression that involves `process` or
  `import.meta`, whatever wraps or asserts it, and any import, require,
  dynamic import or re-export of `node:process`. It does not follow a value
  through an intermediate variable. The files under `ignores` predate this rule: delete
  an entry when its file is fixed and never add one. A justified exception is
  an `ast-grep-ignore` comment naming this rule on the line before the code,
  with the reason in a comment above it.
files:
  - server/domains/**/*.ts
  - src/domains/**/*.ts
  - packages/core/src/**/*.ts
ignores:
  - "**/*.test.ts"
  - server/domains/catalog/catalogPricingJoin.ts
  - server/domains/commerce/commerceDiagnostics.ts
  - server/domains/commerce/dbBackedCommerceQuotePort.ts
  - server/domains/commerce/offerPolicyReadiness.ts
  - server/domains/commerce/promotionCodePreview.ts
  - server/domains/subscription/subscriptionCycleOrderTotals.ts
  - src/domains/shipping/inpostGeowidgetLoader.ts
utils:
  involves-environment:
    any:
      - kind: meta_property
      - { kind: identifier, regex: "^process$" }
      - { kind: property_identifier, regex: "^process$" }
      - has: { stopBy: end, any: [ { kind: meta_property }, { kind: identifier, regex: "^process$" }, { kind: property_identifier, regex: "^process$" }, { kind: string_fragment, regex: "^(node:)?process$" } ] }
rule:
  any:
    - kind: member_expression
      all:
        - has: { field: property, regex: "^env$" }
        - has: { field: object, matches: involves-environment }
    - kind: subscript_expression
      all:
        - has: { field: index, regex: "^[\"'`]env[\"'`]$" }
        - has: { field: object, matches: involves-environment }
    - kind: object_pattern
      regex: "\\benv\\b"
      precedes: { stopBy: end, matches: involves-environment }
    - kind: import_statement
      has: { stopBy: end, kind: string_fragment, regex: "^(node:)?process$" }
    - kind: export_statement
      has: { field: source, has: { kind: string_fragment, regex: "^(node:)?process$" } }
    - kind: call_expression
      all:
        - has: { field: function, regex: "^(import|require)$" }
        - has: { field: arguments, has: { stopBy: end, kind: string_fragment, regex: "^(node:)?process$" } }

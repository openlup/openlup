id: domain-no-environment-reads
language: TypeScript
severity: error
message: Domain code does not read the environment; take the value through a port or a parameter.
note: |
  Architecture rule (AGENTS.md): environment readers stay behind
  infrastructure and adapter boundaries. Read the variable in server/infra or
  in the composition root and pass the value in. The files under `ignores`
  predate this rule: delete an entry when its file is fixed and never add one.
  A justified exception is an `ast-grep-ignore` comment naming this rule on
  the line before the code, with the reason in a comment above it.
files:
  - server/domains/**/*.ts
  - src/domains/**/*.ts
  - packages/core/src/**/*.ts
ignores:
  - "**/*.test.ts"
  - server/domains/catalog/catalogPricingJoin.ts
  - server/domains/commerce/commerceDiagnostics.ts
  - server/domains/commerce/dbBackedCommerceQuotePort.ts
  - server/domains/commerce/offerPolicyReadiness.ts
  - server/domains/commerce/promotionCodePreview.ts
  - server/domains/subscription/subscriptionCycleOrderTotals.ts
  - src/domains/shipping/inpostGeowidgetLoader.ts
utils:
  environment-owner:
    any:
      - kind: meta_property
      - regex: "^\\(?(globalThis\\.|global\\.)?process\\)?$"
      - regex: "^globalThis\\[[\"'`]process[\"'`]\\]$"
      - kind: parenthesized_expression
        has: { stopBy: end, any: [ { kind: meta_property }, { kind: identifier, regex: "^process$" } ] }
      - kind: non_null_expression
        has: { stopBy: end, any: [ { kind: meta_property }, { kind: identifier, regex: "^process$" } ] }
rule:
  any:
    - kind: member_expression
      all:
        - has: { field: object, matches: environment-owner }
        - has: { field: property, regex: "^env$" }
    - kind: subscript_expression
      all:
        - has: { field: object, matches: environment-owner }
        - has: { field: index, regex: "^[\"'`]env[\"'`]$" }
    - kind: variable_declarator
      all:
        - has: { field: name, kind: object_pattern, regex: "\\benv\\b" }
        - has: { field: value, matches: environment-owner }
    - kind: import_statement
      has: { field: source, regex: "^[\"'](node:)?process[\"']$" }
    - kind: export_statement
      has: { field: source, regex: "^[\"'](node:)?process[\"']$" }
    - kind: call_expression
      all:
        - has: { field: function, regex: "^import$" }
        - has: { field: arguments, regex: "^\\([\"'](node:)?process[\"']\\)$" }

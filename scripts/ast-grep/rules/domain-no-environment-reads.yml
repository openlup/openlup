id: domain-no-environment-reads
language: TypeScript
severity: error
message: Domain code does not read the environment; take the value through a port or a parameter.
note: |
  Architecture rule (AGENTS.md): environment readers stay behind
  infrastructure and adapter boundaries. Read the variable in server/infra or
  in the composition root and pass the value in. The rule refuses any `.env`
  or `["env"]` access, and any destructuring of `env` (declaration, parameter
  default, assignment or loop head), on an expression that involves `process`
  or `import.meta`, whatever wraps or asserts it, and any import, `require()`,
  `createRequire()(...)`, dynamic import or re-export of `node:process`. It
  does not follow a value through an intermediate variable. The files under `ignores` predate this rule: delete
  an entry when its file is fixed and never add one. A justified exception is
  an `ast-grep-ignore` comment naming this rule on the line before the code,
  with the reason in a comment above it.
files:
  - server/domains/**/*.ts
  - src/domains/**/*.ts
  - packages/core/src/**/*.ts
ignores:
  - "**/*.test.ts"
  - server/domains/catalog/catalogPricingJoin.ts
  - server/domains/commerce/commerceDiagnostics.ts
  - server/domains/commerce/dbBackedCommerceQuotePort.ts
  - server/domains/commerce/offerPolicyReadiness.ts
  - server/domains/commerce/promotionCodePreview.ts
  - server/domains/subscription/subscriptionCycleOrderTotals.ts
  - src/domains/shipping/inpostGeowidgetLoader.ts
utils:
  env-binding:
    any: [ { kind: object_pattern }, { kind: array_pattern } ]
    regex: "\\benv\\b"
  involves-environment:
    any:
      - kind: meta_property
      - { kind: identifier, regex: "^process$" }
      - { kind: property_identifier, regex: "^process$" }
      - has: { stopBy: end, any: [ { kind: meta_property }, { kind: identifier, regex: "^process$" }, { kind: property_identifier, regex: "^process$" }, { kind: string_fragment, regex: "^(node:)?process$" } ] }
  static-env-index:
    any:
      - kind: string
        has: { kind: string_fragment, regex: "^env$" }
      - kind: template_string
        all:
          - has: { kind: string_fragment, regex: "^env$" }
          - not: { has: { kind: template_substitution } }
      - any: [ { kind: parenthesized_expression }, { kind: as_expression }, { kind: satisfies_expression }, { kind: type_assertion }, { kind: non_null_expression } ]
        has: { matches: static-env-index }
rule:
  any:
    - kind: member_expression
      all:
        - has: { field: property, regex: "^env$" }
        - has: { field: object, matches: involves-environment }
    - kind: subscript_expression
      all:
        - has: { field: index, matches: static-env-index }
        - has: { field: object, matches: involves-environment }
    - any:
        - { kind: variable_declarator, has: { field: name, matches: env-binding } }
        - { kind: required_parameter, has: { field: pattern, matches: env-binding } }
        - { kind: optional_parameter, has: { field: pattern, matches: env-binding } }
      has: { field: value, matches: involves-environment }
    - any:
        - { kind: assignment_expression, has: { field: left, matches: env-binding } }
        - { kind: assignment_pattern, has: { field: left, matches: env-binding } }
        - { kind: for_in_statement, has: { field: left, matches: env-binding } }
      has: { field: right, matches: involves-environment }
    - kind: import_statement
      has: { stopBy: end, kind: string_fragment, regex: "^(node:)?process$" }
    - kind: export_statement
      has: { field: source, has: { kind: string_fragment, regex: "^(node:)?process$" } }
    - kind: call_expression
      all:
        - has:
            field: function
            any:
              - regex: "^(import|require)$"
              - { kind: call_expression, has: { field: function, regex: "(^|\\.)createRequire$" } }
        - has: { field: arguments, has: { stopBy: end, kind: string_fragment, regex: "^(node:)?process$" } }

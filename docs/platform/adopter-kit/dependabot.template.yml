# Dependency updates for an application that installs @openlup/* from npm on 1.x.
# Every @openlup/* package shares one exact set version, so one group moves them
# together and excludes them from cooldown so coordinated releases are never split.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "@openlup/*"
    groups:
      openlup:
        patterns:
          - "@openlup/*"

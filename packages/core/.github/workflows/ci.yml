name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified gitleaks CLI
        run: |
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl -sSfL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" \
            -o "$RUNNER_TEMP/$ARCHIVE"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version
      - name: Scan repository history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner

name: Bug report
description: Something in the platform behaves differently than documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, read [support](https://github.com/openlup/openlup/blob/main/.github/SUPPORT.md)
        and the [installation support policy](https://github.com/openlup/openlup/blob/main/.github/INSTALL_SUPPORT_POLICY.md).
        The supported 1.x installation combines the npm starter, PostgreSQL and
        the qualified application image at the exact release/BOM versions and
        digest. State whether the report reproduces on that composition,
        concerns a bounded public check/reference, or needs a missing capability.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA. "latest" is not a version.
    validations:
      required: true

  - type: dropdown
    id: reproduction-scope
    attributes:
      label: Reproduction scope
      options:
        - Bounded public check or read-only reference
        - Incomplete platform capability
        - Supported stable release/BOM composition
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        Exact steps from a clean install to the wrong behaviour. A report
        without steps someone else can run is a description of a feeling.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected, and where the project documents that expectation.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead, including exact error text. Redact secrets.
    validations:
      required: true

  - type: checkboxes
    id: ai-disclosure
    attributes:
      label: AI assistance
      description: >-
        Disclosure, never a ban. See `.github/AI_CONTRIBUTION_POLICY.md`.
      options:
        - label: An AI tool helped produce this report, and I have verified every claim in it myself.
          required: false

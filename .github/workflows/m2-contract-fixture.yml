# Temporary nonpublishing M2 scheduling fixture; remove after the bounded experiment.
# Inert scheduling proof. No package, checkout, App, secret, OIDC or environment.
name: M2 Contract Fixture
run-name: m2-fixture ${{ inputs.mode }}/${{ inputs.scenario }}/${{ inputs.target_commit }}/${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [release, verify-only]
        default: release
        required: true
      scenario:
        type: choice
        options: [happy, matrix-failure, preflight-failure, verifier-failure, cancel]
        default: happy
        required: true
      target_commit:
        description: Exact fixture source SHA; never a package release target
        type: string
        required: true
      version:
        type: string
        default: '0.0.1'
        required: true
      notes:
        type: string
        default: M2 fixture only.
        required: true
      source_run:
        description: Original fixture run ID in verify-only; blank for release
        type: string
        default: ''
permissions: {}
jobs:
  preflight:
    name: fixture preflight
    if: ${{ github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && inputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    env:
      TARGET: ${{ inputs.target_commit }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Validate inert coordinates and plan
        id: plan
        run: |
          test "$TARGET" = "$GITHUB_SHA"
          test "$VERSION" = 0.0.1
          test "$NOTES" = 'M2 fixture only.'
          test "$SCENARIO" != preflight-failure
          echo 'packages=["alpha","beta"]' >> "$GITHUB_OUTPUT"
  release:
    name: fixture release ${{ matrix.package }}
    needs: preflight
    if: ${{ github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && inputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.preflight.outputs.packages) }}
    concurrency:
      group: m2-contract-fixture-${{ github.run_id }}-${{ matrix.package }}
      cancel-in-progress: false
    env:
      PACKAGE: ${{ matrix.package }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Inert release marker
        run: |
          echo "release-marker $PACKAGE run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT $(date -u +%FT%TZ)"
          sleep 25
          if [ "$SCENARIO" = matrix-failure ] && [ "$PACKAGE" = beta ]; then exit 1; fi
  success_control:
    name: fixture success-only control
    needs: [preflight, release]
    if: ${{ github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && inputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'success-only control reached'
  verify:
    name: fixture verify ${{ inputs.target_commit }} ${{ inputs.version }}
    needs: [preflight, release]
    if: ${{ always() && github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && (inputs.mode == 'release' || inputs.mode == 'verify-only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      SCENARIO: ${{ inputs.scenario }}
      TARGET: ${{ inputs.target_commit }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      SOURCE_RUN: ${{ inputs.source_run }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Observe exact coordinates and real downstream job identities
        run: |
          test "$VERSION" = 0.0.1
          test "$NOTES" = 'M2 fixture only.'
          [[ "$TARGET" =~ ^[a-f0-9]{40}$ ]] || exit 1
          printf '%s\n' "$NEEDS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = release ]; then
            test "$TARGET" = "$GITHUB_SHA"
            source_id="$GITHUB_RUN_ID"
          else
            [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]] || exit 1
            source_id="$SOURCE_RUN"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_id" > "$RUNNER_TEMP/source.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg target "$TARGET" --arg suffix "/$TARGET/$VERSION" '
            .repository.full_name == $repo and .event == "workflow_dispatch" and
            .path == ".github/workflows/m2-contract-fixture.yml" and .head_branch == "main" and
            .head_sha == $target and (.display_title | startswith("m2-fixture release/")) and
            (.display_title | endswith($suffix))
          ' "$RUNNER_TEMP/source.json" >/dev/null
          # Only GET requests; observation never dispatches downstream or waits for producer completion.
          found=false
          for poll in $(seq 1 30); do
            printf 'fixture-observer poll=%s source=%s\n' "$poll" "$source_id"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/m2-contract-publisher-fixture.yml/runs?event=workflow_run&per_page=100" |
              jq --arg title "m2-fixture publisher/$source_id" '[.[].workflow_runs[] | select(.display_title == $title)]' > "$RUNNER_TEMP/downstream.json"
            count="$(jq 'length' "$RUNNER_TEMP/downstream.json")"
            test "$count" -le 1
            if [ "$count" = 1 ]; then
              publisher_id="$(jq -r '.[0].id' "$RUNNER_TEMP/downstream.json")"
              attempt="$(jq -r '.[0].run_attempt' "$RUNNER_TEMP/downstream.json")"
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$publisher_id/attempts/$attempt/jobs?per_page=100" |
                jq '[.[].jobs[]]' > "$RUNNER_TEMP/jobs.json"
              jq '{publisher:'"$publisher_id"',attempt:'"$attempt"',jobs:.}' "$RUNNER_TEMP/jobs.json" >> "$GITHUB_STEP_SUMMARY"
              if jq -e --arg source "$source_id" '
                [.[] | select(.name == ("fixture publish alpha producer " + $source) or .name == ("fixture publish beta producer " + $source))] |
                length == 2 and all(.status == "completed" and .conclusion == "success")
              ' "$RUNNER_TEMP/jobs.json" >/dev/null; then found=true; break; fi
            fi
            sleep 5
          done
          test "$found" = true
          if [ "$MODE" = release ]; then
            jq -e '.preflight.result == "success" and .release.result == "success"' <<< "$NEEDS" >/dev/null
          fi
      # A leaf-job rerun observes prior jobs again without executing their markers.
      - name: Planted first-attempt verifier failure
        if: ${{ inputs.scenario == 'verifier-failure' }}
        run: test "$GITHUB_RUN_ATTEMPT" -gt 1
      # A separate named step makes this window observable through the job API.
      - name: Cancellation window after fake acceptance
        if: ${{ inputs.mode == 'release' && inputs.scenario == 'cancel' }}
        run: |
          echo 'cancel-window: fake publisher jobs completed; observer may cancel THIS fixture producer'
          sleep 120
      - name: Complete inert observation
        run: echo "fixture observation complete run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"

# Publishes the provenance-backed @openlup/* tarball of a published package release
# openlup-<package>-v<version>, which publish-package.yml creates. Source previews carry no
# package: their prereleases never start a job here.
#
# Inert by default: nothing runs unless the repository variable OPENLUP_NPM_STAGE is
# "enabled". The release event must come from the release App bot, and the release, annotated
# tag and GitHub attestation must agree before the package is packed. The publish job uses
# GitHub's OIDC token for the `npm-stage` environment, never a stored npm token. The protected
# `release` approval in publish-package.yml authorizes the release and its package.
# The maintainer setup this relies on is in .github/VERSIONING_AND_EOL.md.
#
# The pack job is unprivileged. It checks, with scripts/packages/release-gate.ts as the dispatch
# workflow does, that:
# - the release commit is on main;
# - the six required GitHub Actions contexts passed there;
# - npm never held the tag's version and holds none above it;
# - the tag's package, at the tag's version, passes `npm run packages:check -- --cold --out`.
# It audits the selected locked dependency graph and then scans the unpacked tarball with gitleaks. The publish job gets only the
# tarball and its digest: no checkout and no install. It shares the package's concurrency group
# with publish-package.yml, re-reads npm past its CDN cache immediately before publishing, and
# refuses a version npm holds or has passed, so no run or re-run moves latest backwards. It
# publishes with --tag latest. A retry must re-run all jobs to repeat the dependency audit;
# the publish-only retry refuses an audit from an earlier workflow attempt.

name: Publish Packages

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  pack:
    name: pack
    if: ${{ github.repository == 'openlup/openlup' && vars.OPENLUP_NPM_STAGE == 'enabled' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'openlup-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      attestations: read
    outputs:
      node-version: ${{ steps.node.outputs.version }}
      package: ${{ steps.tag.outputs.package }}
      audit-attempt: ${{ steps.checked.outputs.audit-attempt }}
    steps:
      - name: Require the release App event and the live immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^openlup-[a-z0-9][a-z0-9-]*-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          release_id="$(jq -er --arg repo "$GITHUB_REPOSITORY" --arg tag "$RELEASE_TAG" '
            select(.action == "published" and .repository.full_name == $repo and
              .sender.type == "Bot" and .sender.id == 334697227 and
              .sender.login == "openlup-release[bot]" and
              .release.tag_name == $tag and .release.prerelease == false and
              .release.draft == false and
              .release.author.id == 334697227 and
              .release.author.login == "openlup-release[bot]" and
              (.release.assets | type) == "array" and (.release.assets | length) == 0 and
              (.release.id | type) == "number") | .release.id
          ' "$GITHUB_EVENT_PATH")" || { echo '::error::Release event identity or immutable release is invalid'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" |
            jq -e --arg tag "$RELEASE_TAG" --argjson id "$release_id" '
              .id == $id and .tag_name == $tag and .prerelease == false and
              .draft == false and .immutable == true and .published_at != null and
              .author.id == 334697227 and .author.login == "openlup-release[bot]" and
              (.assets | type) == "array" and (.assets | length) == 0
            ' >/dev/null || { echo '::error::Live release is not the exact immutable release'; exit 1; }
      # A release event checks out refs/tags/<tag> at GITHUB_SHA; no ref is passed, so a
      # branch with the tag's name cannot stand in for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the annotated tag and GitHub release attestation
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag_ref="refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_headers="$(git cat-file -p "$tag_ref" | sed -n '1,/^$/p')"
          printf '%s\n' "$tag_headers" | grep -Fxq "object $GITHUB_SHA"
          printf '%s\n' "$tag_headers" | grep -Fxq 'type commit'
          printf '%s\n' "$tag_headers" | grep -Fxq "tag $RELEASE_TAG"
          package="${RELEASE_TAG#openlup-}"
          package="${package%-v*}"
          version="${RELEASE_TAG##*-v}"
          test "$(git for-each-ref --format='%(contents)' "$tag_ref")" = "OpenLup package @openlup/$package $version."
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Assert Node and npm contract
        id: node
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
          echo "version=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"
      # The release gate of publish-package.yml, at this release commit.
      - name: The release commit is on main and passed the required contexts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/packages/release-gate.ts commit "$GITHUB_SHA"
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Refuse a version npm holds or passed
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --experimental-strip-types scripts/packages/package-release.ts registry
      - name: Pack and check the release's package
        id: checked
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm run packages:check -- --cold --out packs --release-tag "$RELEASE_TAG"
          node -e 'if (require("./packs/packages-manifest.json").packages.length !== 1) { console.error("a package release packs exactly one package"); process.exit(1); }'
          echo "audit-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Install checksum-verified gitleaks 8.30.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          gh api -H "Accept: application/octet-stream" \
            repos/gitleaks/gitleaks/releases/assets/378332058 > "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      - name: Scan the unpacked tarballs
        run: |
          for tarball in packs/*.tgz; do
            target="$RUNNER_TEMP/scan/$(basename "$tarball" .tgz)"
            mkdir -p "$target"
            tar -xzf "$tarball" -C "$target"
          done
          gitleaks dir "$RUNNER_TEMP/scan" --config config/gitleaks.toml --redact --no-banner
      - name: Summary
        run: |
          {
            echo '### Packed for direct publishing'
            echo '```json'
            cat packs/packages-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packs
          path: packs
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-stage
    permissions:
      id-token: write
    # Shared with publish-package.yml: one package never has two releases or publications in flight.
    concurrency:
      group: openlup-package-release-${{ needs.pack.outputs.package }}
      cancel-in-progress: false
    steps:
      - name: Require the dependency audit from this workflow attempt
        env:
          AUDIT_ATTEMPT: ${{ needs.pack.outputs.audit-attempt }}
        run: |
          if ! [[ "$AUDIT_ATTEMPT" =~ ^[1-9][0-9]*$ && "$AUDIT_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" ]]; then
            echo '::error::Re-run all jobs so packing and the full dependency audit run again before publication.'
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packs
          path: packs
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ needs.pack.outputs.node-version }}
          package-manager-cache: false
      - name: Verify the tarball the pack job checked
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(npm --version)" = "11.19.0"
          # shellcheck disable=SC2016 # the single-quoted script is JavaScript, not shell
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, readdirSync } = require("node:fs");
            const manifest = JSON.parse(readFileSync("packs/packages-manifest.json", "utf8"));
            if (manifest.schemaVersion !== 2 || manifest.commit !== process.env.GITHUB_SHA) throw new Error("the tarball was packed from another commit");
            const tag = /^openlup-([a-z0-9][a-z0-9-]*)-v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(process.env.RELEASE_TAG);
            if (tag === null) throw new Error("the release tag is not a package release tag");
            if (manifest.packages.length !== 1) throw new Error("a package release publishes exactly one package");
            const [{ name, version, filename, sha256 }] = manifest.packages;
            if (name !== `@openlup/${tag[1]}` || version !== tag[2]) throw new Error(`${name}@${version} is not the package the release tag names`);
            if (filename !== `openlup-${tag[1]}-${tag[2]}.tgz`) throw new Error(`unexpected tarball name ${filename}`);
            for (const file of readdirSync("packs")) if (file !== "packages-manifest.json" && file !== filename) throw new Error(`unlisted file ${file}`);
            const actual = createHash("sha256").update(readFileSync(`packs/${filename}`)).digest("hex");
            if (actual !== sha256) throw new Error(`${filename} changed after packing`);
            console.log(filename);
          ' > "$RUNNER_TEMP/tarball-name"
      # An explicit dist-tag turns off npm's own refusal to move latest backwards, and the pack job's
      # check may be stale by the time this job, or a re-run of it, publishes. So read npm again
      # here: the document past its CDN cache, and the uncached dist-tags.
      - name: Refuse a version npm holds or passed, immediately before publishing
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # shellcheck disable=SC2016 # the single-quoted script is JavaScript, not shell
          node -e '
            const { randomUUID } = require("node:crypto");
            const tag = /^openlup-([a-z0-9][a-z0-9-]*)-v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(process.argv[1]);
            if (tag === null) throw new Error("the release tag is not a package release tag");
            const name = `@openlup/${tag[1]}`, version = tag[2], path = `@openlup%2f${tag[1]}`;
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
            const above = (other) => {
              const next = semver.exec(version), previous = semver.exec(other);
              if (previous === null) throw new Error(`npm lists ${name}@${other}, which is not a semver version`);
              for (const index of [1, 2, 3]) if (BigInt(next[index]) !== BigInt(previous[index])) return BigInt(next[index]) > BigInt(previous[index]);
              return previous[4] !== undefined;
            };
            const read = async (url) => {
              const response = await fetch(url, { headers: { Accept: "application/json" } });
              if (response.status === 404) return undefined;
              if (!response.ok) throw new Error(`npm registry refused ${url}: HTTP ${response.status}`);
              return response.json();
            };
            (async () => {
              const document = await read(`https://registry.npmjs.org/${path}?cache-bypass=${randomUUID()}`);
              const distTags = await read(`https://registry.npmjs.org/-/package/${path}/dist-tags`);
              if (document !== undefined && document.name !== name) throw new Error(`npm registry answered ${document.name} for ${name}`);
              const times = Object.keys(document?.time ?? {}).filter((key) => !["created", "modified", "unpublished"].includes(key));
              const held = new Set([...Object.keys(document?.versions ?? {}), ...times, ...Object.values(distTags ?? {})]);
              if (held.has(version)) throw new Error(`${name}@${version} is or was on npm; a version is never republished`);
              for (const other of held) if (!above(other)) throw new Error(`${name}@${version} is not above ${name}@${other} on npm; latest only moves forward`);
              console.log(`npm holds neither ${name}@${version} nor any later version`);
            })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          ' "$RELEASE_TAG"
      # "./" makes npm read a local file; a bare "packs/<file>" is GitHub shorthand for a remote repository.
      # The tag is explicit: every package release moves latest. A re-run repeats the check above, so
      # it refuses once npm holds this version or a later one; then correct forward with a new
      # version. Never overwrite or unpublish one.
      - name: Publish the verified tarball with OIDC provenance
        run: |
          filename="$(cat "$RUNNER_TEMP/tarball-name")"
          npm publish "./packs/$filename" --provenance --access public --tag latest --ignore-scripts

  registry-tutorial:
    name: Guide tutorial against the npm registry (advisory)
    needs: publish
    # Each event publishes one package. Core alone starts the tutorial; wait for its whole set below.
    if: ${{ needs.publish.result == 'success' && startsWith(github.event.release.tag_name, 'openlup-core-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Wait for the published set on npm
        id: registry
        timeout-minutes: 11
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG##*-v}"
          packages="$(node -p 'require("./config/openlup-packages.json").packages.filter(entry => entry.publish).map(entry => entry.name).join(" ")')"
          specs=""
          for package in $packages; do specs="$specs $package@$version"; done
          deadline=$((SECONDS + 600))
          delay=5
          while (( SECONDS < deadline )); do
            ready=true
            # The page reads core's latest version; also wait for that dist-tag to catch up.
            for spec in $specs @openlup/core; do
              remaining=$((deadline - SECONDS))
              if (( remaining <= 0 )); then ready=false; break; fi
              if ! observed="$(timeout "$remaining" npm view "$spec" version --registry=https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000)" || [ "$observed" != "$version" ]; then
                ready=false
                break
              fi
            done
            if [ "$ready" = true ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then break; fi
            wait_seconds=$delay
            if (( wait_seconds > remaining )); then wait_seconds=$remaining; fi
            sleep "$wait_seconds"
            if (( delay < 30 )); then delay=$((delay + 5)); fi
          done
          echo '::warning title=Guide tutorial::Published set not visible on npm within 10 minutes; registry tutorial deferred.'
          echo '### Guide tutorial: deferred (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo "The published set $version was not visible on npm within 10 minutes." >> "$GITHUB_STEP_SUMMARY"
      - name: Start the pinned package-proof PostgreSQL service
        id: postgres
        if: steps.registry.outputs.ready == 'true'
        run: |
          # Use the same digest and pull helper, allowing public fallback without registry credentials.
          image="$(node --input-type=module -e 'import { readCiImage, pullWithRetry } from "./scripts/ci-image-pull.mjs"; console.log(await pullWithRetry(readCiImage("install-proof-postgres")));')"
          container="$(docker run --pull=never --detach --name install-proof-postgres --env POSTGRES_HOST_AUTH_METHOD=trust --publish 127.0.0.1::5432 "$image")"
          echo "container=$container" >> "$GITHUB_OUTPUT"
          echo "port=$(docker port "$container" 5432/tcp | cut -d: -f2)" >> "$GITHUB_OUTPUT"
          docker exec "$container" sh -c 'for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -U postgres -t 1 && exit 0; sleep 1; done; exit 1'
      # --advisory reports a failed tutorial as a warning and exits 0. Remove it after two green
      # merge-group runs on main to make the step blocking (documentation programme, decision D4).
      - name: Guide tutorial against the npm registry (advisory)
        if: steps.registry.outputs.ready == 'true'
        timeout-minutes: 4
        env:
          OPENLUP_PROOF_SERVICE_PORT: ${{ steps.postgres.outputs.port }}
        run: node --experimental-strip-types scripts/packages/guide-tutorial.ts --advisory --registry --page packages/core/docs/guide/start/tutorial.md --database-url "postgresql://postgres@127.0.0.1:$OPENLUP_PROOF_SERVICE_PORT/postgres"
      - name: Remove the package-proof PostgreSQL service
        if: always() && steps.postgres.outcome != 'skipped'
        run: docker rm -f install-proof-postgres

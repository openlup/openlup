name: Mirror CI Images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/ci-images.json, scripts/ci-image-mirror.mjs, .github/workflows/mirror-ci-images.yml]
permissions: {contents: read}
concurrency: {group: mirror-ci-images, cancel-in-progress: false}
jobs:
  mirror:
    if: github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24.21.0, package-manager-cache: false}
      - env: {GHCR_TOKEN: "${{ github.token }}", GHCR_ACTOR: "${{ github.actor }}"}
        run: node scripts/ci-image-mirror.mjs mirror

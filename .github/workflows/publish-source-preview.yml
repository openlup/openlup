# Inert until the maintainer protects release, installs the release App and enables
# OPENLUP_SOURCE_RELEASE and OPENLUP_NPM_STAGE. The unprivileged preflight proves the
# target packs and scans its lockstep package before the release environment asks for approval.
# The npm channel still stages its tarball for maintainer 2FA approval. No PAT and no
# default-token release event suppression.
name: Publish Source Preview

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Reviewed full commit SHA on main
        required: true
        type: string
      preview_number:
        description: Immediately next source preview number N
        required: true
        type: string
      release_notes:
        description: Exact reviewed release body, including adjacent-preview upgrade actions
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-source-preview
  cancel-in-progress: false

jobs:
  package-preflight:
    name: package preflight
    if: ${{ github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && vars.OPENLUP_SOURCE_RELEASE == 'enabled' && vars.OPENLUP_NPM_STAGE == 'enabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    env:
      TARGET_COMMIT: ${{ inputs.target_commit }}
      PREVIEW_NUMBER: ${{ inputs.preview_number }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Validate dispatch coordinates before checkout
        run: |
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PREVIEW_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check main ancestry before running target code
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" FETCH_HEAD
      - name: Check required contexts before running target code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for context in dco typecheck install-proof test self-check gitleaks; do
            verdict="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT/check-runs?check_name=$context&filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length > 0 and all(.conclusion == "success") then "passed" else "missing" end')"
            if [ "$verdict" != "passed" ]; then echo "::error::$context has not passed at $TARGET_COMMIT"; exit 1; fi
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Assert Node and npm contract
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Pack the target package for this preview
        run: node --experimental-strip-types scripts/source-preview-release.ts packages "$RUNNER_TEMP/source-preview-packs"
      - name: Install checksum-verified gitleaks 8.30.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          gh api -H "Accept: application/octet-stream" \
            repos/gitleaks/gitleaks/releases/assets/378332058 > "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      - name: Scan the unpacked tarballs before creating a tag
        run: |
          for tarball in "$RUNNER_TEMP"/source-preview-packs/*.tgz; do
            test -f "$tarball"
            target="$RUNNER_TEMP/scan/$(basename "$tarball" .tgz)"
            mkdir -p "$target"
            tar -xzf "$tarball" -C "$target"
          done
          gitleaks dir "$RUNNER_TEMP/scan" --config config/gitleaks.toml --redact --no-banner

  release:
    needs: package-preflight
    if: ${{ github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && vars.OPENLUP_SOURCE_RELEASE == 'enabled' && vars.OPENLUP_NPM_STAGE == 'enabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      checks: read
      attestations: read
    env:
      TARGET_COMMIT: ${{ inputs.target_commit }}
      PREVIEW_NUMBER: ${{ inputs.preview_number }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Validate dispatch coordinates before checkout
        run: |
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PREVIEW_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Assert Node and npm contract
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
      # Same main ancestry and required-context check as publish-packages.yml.
      - name: The target commit is on main and passed the required contexts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor "$TARGET_COMMIT" FETCH_HEAD || { echo "::error::$TARGET_COMMIT is not on main"; exit 1; }
          for context in dco typecheck install-proof test self-check gitleaks; do
            verdict="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_COMMIT/check-runs?check_name=$context&filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | if length > 0 and all(.conclusion == "success") then "passed" else "missing" end')"
            if [ "$verdict" != "passed" ]; then echo "::error::$context has not passed at $TARGET_COMMIT"; exit 1; fi
          done
      # GitHub's own release attestation of the previous immutable preview binds its tag object.
      - name: Verify the previous preview's GitHub release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release verify "openlup-source-preview/$((PREVIEW_NUMBER - 1))" --repo "$GITHUB_REPOSITORY"
      - name: Check the target describes itself as a descendant and prepare the note
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_out="$(realpath "$(mktemp -d "$RUNNER_TEMP/source-preview.XXXXXX")")"
          echo "RELEASE_OUTPUT_DIR=$release_out" >> "$GITHUB_ENV"
          RELEASE_OUTPUT_DIR="$release_out" node --experimental-strip-types scripts/source-preview-release.ts prepare
      - name: Obtain the maintainer-configured release identity
        id: release-identity
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OPENLUP_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENLUP_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: openlup
          permission-contents: write
          permission-administration: read
      - name: Refuse unless repository release immutability is enabled
        env:
          GH_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
      - name: Create the exact annotated tag with the release identity
        env:
          GH_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: |
          tag="openlup-source-preview/$PREVIEW_NUMBER"
          message="OpenLup source preview $PREVIEW_NUMBER."
          tag_object="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$tag" -f message="$message"$'\n' -f object="$TARGET_COMMIT" -f type=commit --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_object"
          git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: |
          tag="openlup-source-preview/$PREVIEW_NUMBER"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$(git rev-parse "refs/tags/$tag")"
          draft_id="$(jq -n --arg tag "$tag" --arg name "OpenLup source preview $PREVIEW_NUMBER" \
            --rawfile body "$RELEASE_OUTPUT_DIR/notes.md" \
            '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:true}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input - --jq .id)"
          [[ "$draft_id" =~ ^[1-9][0-9]*$ ]]
          echo "RELEASE_ID=$draft_id" >> "$GITHUB_ENV"
      - name: Refuse publication if the draft differs
        env:
          GITHUB_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: node --experimental-strip-types scripts/source-preview-release.ts check-draft
      # The App token, rather than GITHUB_TOKEN, emits release.published for Publish Packages.
      - name: Publish the immutable prerelease with the release identity
        env:
          GH_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          printf '{"draft":false}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - \
            --jq '{id,tag_name,draft,prerelease,immutable,published_at}'
      - name: Verify the completed immutable release and its tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/source-preview-release.ts verify
      # Publishing an immutable release makes GitHub attest the tag object; the release carries no asset.
      - name: Verify GitHub's release attestation of the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release verify "openlup-source-preview/$PREVIEW_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: Recovery requires the maintainer
        if: failure()
        run: |
          echo '::error::Release refused. Inspect this run and any unpublished tag/draft before retrying. No tag, asset or body is overwritten or deleted automatically; published releases are corrected forward.'

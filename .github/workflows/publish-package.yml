# Releases one @openlup/* package at a reviewed commit on main, as the annotated tag
# openlup-<package>-v<version> and an immutable GitHub release. That release's published event
# starts publish-packages.yml, which publishes the package to npm with --tag latest through OIDC.
# The package `all` releases the whole set: every publishable package at the one set version
# 0.N.P, each with its own tag and release at the target, under one release approval.
#
# Inert until the maintainer completes the setup in .github/VERSIONING_AND_EOL.md and enables
# OPENLUP_PACKAGE_RELEASE. Main ancestry, the required contexts and the tag's commit are decided
# by scripts/packages/release-gate.ts as it is at the dispatched main commit: the target's own code
# never decides whether the target is released. Both jobs check out that main commit first, set up
# Node from its .nvmrc, assert its Node contract and run its gate; only after the gate passes do
# they check out the target, into target/, and run anything of it there. The unprivileged
# preflight checks, before the protected release environment asks for approval, that:
# - no release or publication of any package is in flight, so this dispatch never waits in a
#   concurrency group where it could cancel a queued publication;
# - the target is on main and the six required contexts passed there;
# - packages/<package>/package.json carries the requested version and passes the manifest policy;
#   for the set, every publishable package carries the set version, and a patch set leaves each
#   API snapshot as the previous set left it;
# - the tag is absent, and npm never held that version and holds none above it;
# - `npm run packages:check -- --out` packs that one package, or every publishable package;
# - gitleaks finds nothing in the unpacked tarball;
# - each package's tag, release and npm state decides what happens to it. One package is released
#   only from nothing. The set skips a package npm already holds with the same tarball, leaves a
#   package whose release exists but npm lacks the version to the re-run of its failed
#   publication, releases the rest in full, and stops on any other state.
# The release job runs once per package to release in full; its legs wait for one approval. A
# re-run of a failed leg skips the preflight and its in-flight refusal: re-run legs only after any
# pending publication of their package has completed.
# The pack and the scan run only here. Before the release App token exists, the release job
# re-verifies the main ancestry and contexts, the manifest policy and version
# (`packages:check --release-tag`, with no install, build or pack), the patch-set check, the
# absent tag and npm; it installs nothing and runs no package code. A fresh copy of main's release
# gate, taken from the dispatched commit in the tag step itself, then creates the tag on the target.
# publish-packages.yml packs and scans the published tag again.
# The plan's packages reach the release job as matrix values, and each leg checks its package
# again and runs only for a package the dispatch named, so the plan can narrow a release but
# never widen it. One package's release job
# and publication share a concurrency group, so they never overlap. No PAT; the job's own token
# only reads. Dispatching a run grants no publication: the release approval does.
name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory name under packages/, or all for every publishable package
        required: true
        type: string
      version:
        description: The MAJOR.MINOR.PATCH version that package.json already carries; for all, the set version
        required: true
        type: string
      target_commit:
        description: Reviewed full commit SHA on main
        required: true
        type: string
      notes:
        description: Exact reviewed release body
        required: true
        type: string

permissions: {}

jobs:
  preflight:
    name: preflight
    if: ${{ github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && vars.OPENLUP_PACKAGE_RELEASE == 'enabled' && vars.OPENLUP_NPM_STAGE == 'enabled' }}
    runs-on: ubuntu-24.04
    # The packages the plan step releases in full, as a JSON array of directory names.
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      actions: read
    env:
      PACKAGE: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      TARGET_COMMIT: ${{ inputs.target_commit }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - name: Validate dispatch coordinates before checkout
        run: |
          [[ "$PACKAGE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      # Until the gate passes, the workspace is the dispatched main commit and nothing of the target
      # is checked out: setup-node's version probes and every command run in main's tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Assert the Node and npm contract of the dispatched main commit
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.node')" = "24.x"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')" = "npm@11.19.0"
      # GitHub keeps one pending run per concurrency group and cancels the older one, so a dispatch
      # that waited behind another could cancel a queued publication. It refuses instead.
      - name: Refuse while any package release or publication is in flight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/packages/release-gate.ts in-flight "$GITHUB_RUN_ID"
      - name: Check main ancestry and required contexts before running target code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/packages/release-gate.ts commit "$TARGET_COMMIT"
      # After the gate the target is reviewed main code, checked out into its own directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Assert the target's Node and npm contract
        working-directory: target
        run: |
          test "$(cat .nvmrc)" = "$(node -p 'process.versions.node.split(".")[0]')"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.node')" = "24.x"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')" = "npm@11.19.0"
      - run: npm ci --ignore-scripts --no-audit --fund=false
        working-directory: target
      - name: Refuse a mismatched version, an existing tag and a version npm holds or passed
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/packages/package-release.ts preflight
      - name: Pack and check the packages of this release
        working-directory: target
        run: |
          if [ "$PACKAGE" = all ]; then
            npm run packages:check -- --out "$RUNNER_TEMP/packs" --release-set "$VERSION"
          else
            npm run packages:check -- --out "$RUNNER_TEMP/packs" --release-tag "openlup-$PACKAGE-v$VERSION"
          fi
      - name: Install checksum-verified gitleaks 8.30.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          gh api -H "Accept: application/octet-stream" \
            repos/gitleaks/gitleaks/releases/assets/378332058 > "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      - name: Scan the unpacked tarball before creating a tag
        run: |
          for tarball in "$RUNNER_TEMP"/packs/*.tgz; do
            test -f "$tarball"
            target="$RUNNER_TEMP/scan/$(basename "$tarball" .tgz)"
            mkdir -p "$target"
            tar -xzf "$tarball" -C "$target"
          done
          gitleaks dir "$RUNNER_TEMP/scan" --config config/gitleaks.toml --redact --no-banner
      # Each package by its tag, release and npm state, against the tarballs packed above.
      - name: Decide each package's release from its tag, release and npm state
        id: plan
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/packages/package-release.ts plan "$RUNNER_TEMP/packs"

  release:
    needs: preflight
    if: ${{ github.repository == 'openlup/openlup' && github.ref == 'refs/heads/main' && vars.OPENLUP_PACKAGE_RELEASE == 'enabled' && vars.OPENLUP_NPM_STAGE == 'enabled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One leg per package the preflight planned, each the release of that one package. The legs wait
    # for the protected environment together, so one approval covers the set. A failed leg leaves
    # the others to finish; dispatching the set again skips or resumes what they released.
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.preflight.outputs.packages) }}
    # Shared with the publish job of publish-packages.yml: one package never has two releases or
    # publications in flight. The preflight refuses while any is, so no run waits here behind one.
    concurrency:
      group: openlup-package-release-${{ matrix.package }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: read
      checks: read
      attestations: read
    env:
      PACKAGE: ${{ matrix.package }}
      DISPATCH: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}
      TARGET_COMMIT: ${{ inputs.target_commit }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      # A leg releases one package, and only one the dispatch named: itself, or any for the set.
      - name: Validate dispatch coordinates before checkout
        run: |
          [[ "$PACKAGE" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          [[ "$PACKAGE" != all ]]
          [[ "$DISPATCH" = all || "$DISPATCH" = "$PACKAGE" ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$TARGET_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      # As in the preflight: main's commit, its Node and its gate before anything of the target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Assert the Node and npm contract of the dispatched main commit
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.node')" = "24.x"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')" = "npm@11.19.0"
      # The same release gate as the preflight and publish-packages.yml.
      - name: The target commit is on main and passed the required contexts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/packages/release-gate.ts commit "$TARGET_COMMIT"
      # After the gate the target is reviewed main code, checked out into its own directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_commit }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Assert the target's Node and npm contract
        working-directory: target
        run: |
          test "$(cat .nvmrc)" = "$(node -p 'process.versions.node.split(".")[0]')"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines.node')" = "24.x"
          test "$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager')" = "npm@11.19.0"
      # No install, build or pack here: the pack and the scan ran in the unprivileged preflight.
      - name: Repeat the manifest, version, tag and npm refusals and prepare the note
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_out="$(realpath "$(mktemp -d "$RUNNER_TEMP/package-release.XXXXXX")")"
          echo "RELEASE_OUTPUT_DIR=$release_out" >> "$GITHUB_ENV"
          RELEASE_OUTPUT_DIR="$release_out" node --experimental-strip-types scripts/packages/package-release.ts prepare
      - name: Obtain the maintainer-configured release identity
        id: release-identity
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OPENLUP_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENLUP_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: openlup
          permission-contents: write
          permission-administration: read
      - name: Refuse unless repository release immutability is enabled
        env:
          GH_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
      # Target code ran in this job, so the gate that tags is a fresh copy of main's, taken from the
      # dispatched commit here: it re-checks the target's main ancestry and tags the target itself.
      - name: Create the exact annotated tag with the release identity
        env:
          GITHUB_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: |
          gate="$(mktemp -d "$RUNNER_TEMP/release-gate.XXXXXX")/release-gate.mts"
          git show "$GITHUB_SHA:scripts/packages/release-gate.ts" > "$gate"
          node --experimental-strip-types "$gate" tag "$TARGET_COMMIT" "$PACKAGE" "$VERSION"
          tag="openlup-$PACKAGE-v$VERSION"
          git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: |
          tag="openlup-$PACKAGE-v$VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$(git rev-parse "refs/tags/$tag")"
          draft_id="$(jq -n --arg tag "$tag" --arg name "@openlup/$PACKAGE $VERSION" \
            --rawfile body "$RELEASE_OUTPUT_DIR/notes.md" \
            '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:false}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input - --jq .id)"
          [[ "$draft_id" =~ ^[1-9][0-9]*$ ]]
          echo "RELEASE_ID=$draft_id" >> "$GITHUB_ENV"
      - name: Refuse publication if the draft differs
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: node --experimental-strip-types scripts/packages/package-release.ts check-draft
      # The App token, rather than GITHUB_TOKEN, emits release.published for Publish Packages.
      - name: Publish the immutable release with the release identity
        env:
          GH_TOKEN: ${{ steps.release-identity.outputs.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          printf '{"draft":false}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - \
            --jq '{id,tag_name,draft,prerelease,immutable,published_at}'
      - name: Verify the completed immutable release and its tag
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/packages/package-release.ts verify
      - name: Verify GitHub's release attestation of the published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release verify "openlup-$PACKAGE-v$VERSION" --repo "$GITHUB_REPOSITORY"
      - name: Recovery requires the maintainer
        if: failure()
        run: |
          echo '::error::Release refused. Inspect this run and any unpublished tag or draft before retrying. No tag, release or npm version is overwritten or deleted automatically; published releases are corrected forward with a new version. A set resumes when it is dispatched again with package all.'

# The checks this tree runs on itself.
#
# Main pushes reuse expensive checks only after exact-commit merge-group proof;
# unavailable evidence runs the ordinary commands. Event-bound cheap checks always run.
# Six required mechanical checks preserve the protected-main contract. Root test shards
# feed the required test aggregate; pgTAP creates a disposable local CLI stack
# as a raw diagnostic. The optional native context admits current review only after
# the six required checks actually succeeded. Nothing here deploys or publishes.
# The gitleaks release download is checksum-verified before use.
#
# The workflow stays product-name-neutral so a future rename does not churn CI. The current public
# name is settled as OpenLup; neutrality here is an automation-maintenance choice, not indecision.
#
# This workflow is also carried by the private source checkout, so every mechanical context applies
# the same trusted event-metadata fence directly. Optional native admission waits for all six actual
# successes once explicitly activated. Repository visibility comes from GitHub's event context,
# never checked-out bytes. A disabled admission job is preparation, not activation proof.

name: Published Tree CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: published-tree-ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'merge_group' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CONTRIBUTING.md requires a Developer Certificate of Origin sign-off on every commit and states
  # that there is no CLA; GOVERNANCE.md names that file as the single source. This job is what
  # makes that a rule rather than a sentence. It is deliberately first, deliberately the cheapest -
  # no install, seconds not minutes - and deliberately not a third-party action: the reasons are in
  # scripts/dco-signoff-check.ts, a small local Git reader with no dependency installation.
  #
  # The first push uses GitHub's all-zero before value to select the one-parentless-root mode.
  # Later main pushes, pull requests and merge groups check their complete event base..head range.
  # The checker refuses malformed or empty ranges and missing sign-offs in every mode.
  dco:
    name: dco
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole range, not the tip. A shallow checkout has neither end of it, and the check
          # refuses to pass on a range it could not read rather than reporting success over zero.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      # No install: the check reads git and nothing else, so it runs on the bare runtime.
      - name: Sign-off on every pull-request commit
        if: github.event_name == 'pull_request'
        # Through the environment rather than into the command line, and re-validated as full
        # digests inside the script, so nothing here can reach `git` as an option.
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: npm run check:dco-signoff -- "$RANGE_BASE" "$RANGE_HEAD"
      - name: Sign-off on every merge-group commit
        if: github.event_name == 'merge_group'
        env:
          QUEUE_ACTION: ${{ github.event.action }}
          RANGE_BASE: ${{ github.event.merge_group.base_sha }}
          RANGE_HEAD: ${{ github.event.merge_group.head_sha }}
          RANGE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          RANGE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          [[ "$RANGE_BASE" =~ ^[0-9a-f]{40}$ && "$RANGE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$QUEUE_ACTION" = "checks_requested"
          test "$RANGE_BASE_REF" = "refs/heads/main"
          test "$RANGE_REF" = "$GITHUB_REF"
          case "$RANGE_REF" in refs/heads/gh-readonly-queue/main/*) ;; *) exit 1 ;; esac
          git check-ref-format "$RANGE_REF"
          test "$RANGE_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RANGE_HEAD"
          test "$RANGE_BASE" != "$RANGE_HEAD"
          test "$RANGE_BASE" != "0000000000000000000000000000000000000000"
          git merge-base --is-ancestor "$RANGE_BASE" "$RANGE_HEAD"
          npm run check:dco-signoff -- "$RANGE_BASE" "$RANGE_HEAD"
      - name: Sign-off on every main push
        if: github.event_name == 'push'
        env:
          RANGE_BASE: ${{ github.event.before }}
          RANGE_HEAD: ${{ github.sha }}
        run: |
          npm run check:dco-signoff -- "$RANGE_BASE" "$RANGE_HEAD"

  typecheck:
    name: typecheck
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Check completed merge-group evidence for this main push
        id: reused
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/public-ci-reuse.mjs
      - name: Assert Node and npm contract
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
      - run: npm ci
        if: steps.reused.outputs.reuse != 'true'
      # NOT `npm run typecheck`. The release contract names every compiler project and carries the
      # signed preview-debt ratchet. The source-only measurement baseline is deliberately absent.
      # A new unresolved edge fails, and so does a signed edge that is gone.
      - name: Package and domain import boundaries
        if: steps.reused.outputs.reuse != 'true'
        run: npm run lint
      - run: npm run oss:published-tree -- --typecheck
        if: steps.reused.outputs.reuse != 'true'

  install-packages:
    name: install-packages
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      reuse: ${{ steps.reused.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      # The public root build is the complete build truth. Its bounded chain is projected into
      # package.json and catalogued; CI does not call a source-only prebuild or deployment guard.
      - name: Check completed merge-group evidence for this main push
        id: reused
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/public-ci-reuse.mjs
      - name: Assert Node and npm contract
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
      - name: Refuse newly introduced vulnerable dependencies
        if: steps.reused.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/public-ci-dependencies.mjs
      - run: npm ci --prefer-offline --no-audit --fund=false
        if: steps.reused.outputs.reuse != 'true'
      - run: npm run build
        if: steps.reused.outputs.reuse != 'true'
      - name: Build the disposable subscription profile
        if: steps.reused.outputs.reuse != 'true'
        env:
          OPENLUP_REFERENCE_PROFILE: subscription
          OPENLUP_BUILD_OUT_DIR: dist-subscription
          OPENLUP_SSR_OUT_DIR: dist-subscription-ssr
        run: npm run build:public-reference
      - name: Authenticate GitHub Container Registry pulls
        if: steps.reused.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      # An explicit service starts after login; workflow services pull before any step.
      - name: Start the pinned package-proof PostgreSQL service
        id: postgres
        if: steps.reused.outputs.reuse != 'true'
        run: |
          image="$(node --input-type=module -e 'import { readCiImage, pullWithRetry } from "./scripts/ci-image-pull.mjs"; const image = readCiImage("install-proof-postgres"); image.sources = image.sources.slice(0, 1); console.log(await pullWithRetry(image));')"
          container="$(docker run --pull=never --detach --name install-proof-postgres --env POSTGRES_HOST_AUTH_METHOD=trust --publish 127.0.0.1::5432 "$image")"
          echo "container=$container" >> "$GITHUB_OUTPUT"
          echo "port=$(docker port "$container" 5432/tcp | cut -d: -f2)" >> "$GITHUB_OUTPUT"
      - name: Every publishable package API and installed-artifact proof
        if: steps.reused.outputs.reuse != 'true'
        env:
          OPENLUP_PROOF_SERVICE_CONTAINER: ${{ steps.postgres.outputs.container }}
          OPENLUP_PROOF_SERVICE_PORT: ${{ steps.postgres.outputs.port }}
        run: node --experimental-strip-types scripts/packages/required-package-gates.ts --out "$RUNNER_TEMP/package-gates" --expected-commit "$(git rev-parse HEAD)"
      - name: Remove the package-proof PostgreSQL service
        if: always() && steps.postgres.outcome != 'skipped'
        run: docker rm --force install-proof-postgres
      # Transfer only the verified public set once, rather than cold-packing in each browser shard.
      - name: Share verified candidate packages
        if: steps.reused.outputs.reuse != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-packages
          path: |
            ${{ runner.temp }}/package-gates/packages-manifest.json
            ${{ runner.temp }}/package-gates/*.tgz
          if-no-files-found: error
          retention-days: 1

  install-browser:
    name: install-browser (${{ matrix.groups }})
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    needs: [install-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      packages: read
    # Four shards bound journey work to 125s (seven: 101s), saving three installs/builds/image pulls.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        groups: ['0', '1,6', '2,4', '3,5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      # Share the producer's reuse decision so a reused producer never leaves a consumer without packs.
      - name: Assert Node and npm contract
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
        if: needs.install-packages.outputs.reuse != 'true'
      - name: Download verified candidate packages
        if: needs.install-packages.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-packages
          path: ${{ runner.temp }}/package-gates
      - name: Authenticate GitHub Container Registry pulls
        if: needs.install-packages.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Starter database browser journeys
        if: needs.install-packages.outputs.reuse != 'true'
        env:
          BROWSER_GROUPS: ${{ matrix.groups }}
        run: node --experimental-strip-types scripts/starter-browser-ci.mjs --manifest "$RUNNER_TEMP/package-gates/packages-manifest.json" --expected-commit "$(git rev-parse HEAD)" --groups "$BROWSER_GROUPS"

  install-proof:
    name: install-proof
    if: ${{ always() && github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    needs: [install-packages, install-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Reuse skips expensive steps inside successful jobs, never the dependency jobs themselves.
      - name: Require package proof and every browser shard to succeed
        env:
          PACKAGE_RESULT: ${{ needs.install-packages.result }}
          BROWSER_RESULT: ${{ needs.install-browser.result }}
        run: test "$PACKAGE_RESULT" = "success" && test "$BROWSER_RESULT" = "success"

  test-full-shard:
    name: test-full-shard (${{ matrix.shard }}/6)
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - name: Check completed merge-group evidence for this main push
        id: reused
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/public-ci-reuse.mjs
      - name: Assert Node and npm contract
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
      - run: npm ci
        if: steps.reused.outputs.reuse != 'true'
      - name: Select tooling fixtures from the event diff
        if: steps.reused.outputs.reuse != 'true'
        env:
          OPENLUP_VITEST_EXCLUDE_FILE: ${{ runner.temp }}/ci-test-exclude.txt
        run: node scripts/ci-test-scope.mjs
      - name: Authenticate GitHub Container Registry pulls
        if: steps.reused.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      # Managed-rail suites install the checksum-pinned packages; every cached file is re-verified.
      - name: Restore pinned PostgreSQL test packages
        if: steps.reused.outputs.reuse != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/scratch/cache/pgtap-debs
          key: pgtap-debs-${{ hashFiles('config/ci-postgres-packages.json') }}
      # Every shard derives the same included set before native file sharding.
      - name: Complete published root test shard
        if: steps.reused.outputs.reuse != 'true'
        env:
          OPENLUP_VITEST_EXCLUDE_FILE: ${{ runner.temp }}/ci-test-exclude.txt
          OPENLUP_PGTAP_DEB_CACHE: ${{ github.workspace }}/.context/scratch/cache/pgtap-debs
        run: npm test -- --shard=${{ matrix.shard }}/6

  test:
    name: test
    if: ${{ always() && github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    needs: [test-full-shard, pgtap]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require all six full-root shards and pgTAP to succeed
        env:
          SHARD_RESULT: ${{ needs.test-full-shard.result }}
          PGTAP_RESULT: ${{ needs.pgtap.result }}
        run: test "$SHARD_RESULT" = "success" && test "$PGTAP_RESULT" = "success"

  self-check:
    name: self-check
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Group documentation impact uses its event base across the complete batch ancestry.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      # No install: the check reads the tracked inventory, the surface catalog and the root
      # manifest, and imports nothing outside this tree. It fails when a path appears that no
      # publishable family claims, when one appears that a withholding family would have removed,
      # or when the root manifest still carries an unresolved conditional seam. It prints the path
      # count and the manifest digest, which are the two headline numbers of the export receipt
      # this tree was created from.
      - run: npm run oss:published-tree -- --policy
      - run: npm run oss:published-tree -- --inventory
      - name: UI package neutrality
        run: node --experimental-strip-types packages/ui/smoke/neutrality.ts
      - name: Tree-wide neutrality shrink-only ratchet
        env:
          NEUTRALITY_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node scripts/public-ci-neutrality.mjs --base-commit "$NEUTRALITY_BASE_COMMIT"

  gitleaks:
    name: gitleaks
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified gitleaks 8.30.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          gh api -H "Accept: application/octet-stream" \
            repos/gitleaks/gitleaks/releases/assets/378332058 > "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version
      # Pull requests and merge groups scan only the commits they add; main pushes and every other
      # event keep the complete-history scan. Merge-group ranges cover everything that reaches main
      # only while the main ruleset's merge queue is ALLGREEN, merges one entry per group with the
      # MERGE method and has no bypass actor; a change to those settings needs this scope reviewed
      # again. A range that changes config/gitleaks.toml or .gitleaksignore scans the complete
      # history instead, so a tightened rule or a removed fingerprint re-checks history before
      # landing. Event SHAs arrive through the environment and must be full digests of commits in
      # this checkout with at least one commit between them: gitleaks itself passes an unreadable
      # or empty range as zero commits scanned.
      - name: Scan the event range, or the complete available history
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) range_base="$PR_BASE"; range_head="$PR_HEAD" ;;
            merge_group) range_base="$GROUP_BASE"; range_head="$GROUP_HEAD" ;;
            *) exec gitleaks git . --config config/gitleaks.toml --redact --no-banner ;;
          esac
          if [[ ! "$range_base" =~ ^[0-9a-f]{40}$ || ! "$range_head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The $GITHUB_EVENT_NAME scan needs full base and head commit SHAs." >&2
            exit 1
          fi
          for commit in "$range_base" "$range_head"; do
            git cat-file -e "$commit^{commit}" || { echo "Commit $commit is missing from this checkout." >&2; exit 1; }
          done
          range_commits="$(git rev-list --count "$range_base..$range_head")"
          if [[ ! "$range_commits" =~ ^[1-9][0-9]*$ ]]; then
            echo "The $GITHUB_EVENT_NAME range $range_base..$range_head adds no commits." >&2
            exit 1
          fi
          if ! git diff --quiet "$range_base" "$range_head" -- config/gitleaks.toml .gitleaksignore; then
            echo "The range changes config/gitleaks.toml or .gitleaksignore; scanning the complete available history."
            exec gitleaks git . --config config/gitleaks.toml --redact --no-banner
          fi
          echo "Scanning $range_commits commits in $GITHUB_EVENT_NAME range $range_base..$range_head"
          gitleaks git . --config config/gitleaks.toml --redact --no-banner --log-opts "$range_base..$range_head"

  pgtap:
    name: pgtap
    if: ${{ github.event.repository.private == false && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Check completed merge-group evidence for this main push
        id: reused
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/public-ci-reuse.mjs
      - name: Assert Node and npm contract
        run: |
          test "$(node -p 'process.versions.node.split(".")[0]')" = "24"
          test "$(npm --version)" = "11.19.0"
          test "$(node -p 'require("./package.json").engines.node')" = "24.x"
          test "$(node -p 'require("./package.json").packageManager')" = "npm@11.19.0"
      - name: Authenticate GitHub Container Registry pulls
        if: steps.reused.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      # Restore the checksum-pinned packages; the runner re-verifies every cached file.
      - name: Restore pinned PostgreSQL test packages
        if: steps.reused.outputs.reuse != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/scratch/cache/pgtap-debs
          key: pgtap-debs-${{ hashFiles('config/ci-postgres-packages.json') }}
      - name: Every shipped pgTAP test on stock PostgreSQL with the managed-compat adapter
        if: steps.reused.outputs.reuse != 'true'
        env:
          OPENLUP_PGTAP_DEB_CACHE: ${{ github.workspace }}/.context/scratch/cache/pgtap-debs
        run: node scripts/public-ci-pgtap.mjs

  native-review:
    name: native-review
    if: ${{ always() && vars.OPENLUP_NATIVE_QUEUE == 'enabled' && github.event.repository.private == false && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.user.login != 'dependabot[bot]' || (github.event.action == 'ready_for_review' && github.event.sender.type == 'User')))) }}
    needs: [dco, typecheck, install-proof, test, self-check, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      issues: read
      contents: read
      pull-requests: read
    steps:
      - name: Require six actual mechanical successes
        env:
          NEEDS_DCO: ${{ needs.dco.result }}
          NEEDS_TYPECHECK: ${{ needs.typecheck.result }}
          NEEDS_INSTALL_PROOF: ${{ needs.install-proof.result }}
          NEEDS_TEST: ${{ needs.test.result }}
          NEEDS_SELF_CHECK: ${{ needs.self-check.result }}
          NEEDS_GITLEAKS: ${{ needs.gitleaks.result }}
        run: |
          for result in "$NEEDS_DCO" "$NEEDS_TYPECHECK" "$NEEDS_INSTALL_PROOF" "$NEEDS_TEST" "$NEEDS_SELF_CHECK" "$NEEDS_GITLEAKS"; do
            if [ "$result" != "success" ]; then
              echo "Native admission requires six actual mechanical successes." >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Await exact-candidate native review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agent-review-queue.mjs wait

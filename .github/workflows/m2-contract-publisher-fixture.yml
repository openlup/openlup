# Temporary independent fake publisher for the bounded M2 scheduling experiment.
# Independent fake downstream. No checkout, package, credentials, App, OIDC or environment.
name: M2 Contract Publisher Fixture
run-name: m2-fixture publisher/${{ github.event.workflow_run.id }}
on:
  workflow_run:
    workflows: [M2 Contract Fixture]
    types: [requested]
    branches: [main]
permissions: {}
jobs:
  pack:
    name: fixture pack producer ${{ github.event.workflow_run.id }}
    if: ${{ github.repository == 'openlup/openlup' && github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.display_title, 'm2-fixture release/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: sleep 35
  publish:
    name: fixture publish ${{ matrix.package }} producer ${{ github.event.workflow_run.id }}
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        package: [alpha, beta]
    concurrency:
      group: m2-contract-fixture-${{ github.event.workflow_run.id }}-${{ matrix.package }}
      cancel-in-progress: false
    env:
      PACKAGE: ${{ matrix.package }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Inert acceptance marker
        run: |
          echo "fake-acceptance $PACKAGE source=$SOURCE_RUN publisher=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT $(date -u +%FT%TZ)"
          sleep 10

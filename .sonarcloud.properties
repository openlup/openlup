# One Cloud automatic-analysis project; no scanner job or coverage import.
# Keep HTTP entrypoints, domains and adapters together for data-flow analysis.
sonar.sources=.
sonar.inclusions=api/**,server/**,src/**,packages/core/src/**,packages/ui/src/**,mcp/**,scripts/**,.github/workflows/**,deploy/**
# Test inclusions also remove these files from the production-source scope.
sonar.tests=.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/*.testFixtures.*,**/*.fixture.*,**/*.fixtures.*,**/fixtures.*,**/*TestKit.*,**/*TestHelpers.*,**/*.testHelpers.*,**/testSupport/**,**/testFixtures/**,**/__tests__/**,**/fixtures/**,tests/**,src/test/**,packages/core/test/**,packages/core/smoke/**,packages/ui/smoke/**,scripts/ast-grep/rule-tests/**
# SQL stays outside this pilot; migration contracts and pgTAP remain its owners.
sonar.exclusions=**/*.d.ts,**/*.sql,src/integrations/supabase/types.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/release/**
sonar.sourceEncoding=UTF-8

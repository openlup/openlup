# Structural rules that `npm run lint` runs after ESLint. ESLint owns import
# boundaries; these rules check calls and reads that an import rule cannot see.
# Each rule names the platform rule it enforces and the fix. A new rule needs a
# test in scripts/ast-grep/rule-tests with at least one valid and one invalid
# case. See CONTRIBUTING.md, "Development preview checks".
ruleDirs:
  - scripts/ast-grep/rules
testConfigs:
  - testDir: scripts/ast-grep/rule-tests
